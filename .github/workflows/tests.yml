name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.1, 8.2, 8.3, 8.4]
        dependency-version: [prefer-stable]

    name: P${{ matrix.php }} - ${{ matrix.os }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, json, ctype, mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer update --${{ matrix.dependency-version }} --no-interaction --prefer-dist

      - name: Execute tests
        run: vendor/bin/phpunit
